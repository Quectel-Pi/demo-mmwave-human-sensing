<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>R60ABD1</title>
<style>
:root{
  --bg:#f5f7fb;--card:#fff;--ink:#1d2939;--muted:#667085;--faint:#98a2b3;--line:#e8ecf3;
  --primary:#3b6cf4;--primary-soft:#eaf0ff;
  --resp:#0d9488;--heart:#e11d48;--amp:#d97706;
  --ok:#15803d;--ok-soft:#e7f6ec;--warn:#b45309;--warn-soft:#fff4de;--bad:#b91c1c;--bad-soft:#fdeaea;--idle-soft:#eef1f6;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.05);
  font:15px/1.55 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--bg);
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
header{background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1200px;margin:auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#5b8cff,#3b6cf4);display:grid;place-items:center;color:#fff}
.logo svg{width:20px;height:20px}
h1{font-size:18px;margin:0;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--idle-soft);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 16px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:var(--primary);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.12)}
.seg button:disabled{cursor:default}
.lang{font:inherit;font-size:13px;font-weight:600;color:var(--primary);background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}
.lang:hover{background:var(--primary-soft)}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.chip[data-state=ok] .dot{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.chip[data-state=busy] .dot{background:#f59e0b}
.chip[data-state=bad] .dot{background:#ef4444}
main{max-width:1200px;margin:auto;padding:22px 24px 40px;display:grid;gap:20px}
.banner{padding:11px 16px;border-radius:12px;font-size:14px}
.banner.note{background:var(--warn-soft);color:var(--warn)}
.banner.alert{background:var(--bad-soft);color:var(--bad);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.label{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px}
.big{font-size:38px;font-weight:650;line-height:1.15;margin:8px 0 6px;letter-spacing:-.5px}
.big small{font-size:14px;font-weight:400;color:var(--muted);margin-left:6px;letter-spacing:0}
.big.dim{color:var(--faint)}
.sub{font-size:12px;color:var(--faint);min-height:18px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--idle-soft);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.meter{height:6px;border-radius:6px;background:var(--idle-soft);overflow:hidden;margin:4px 0 8px}
.meter i{display:block;height:100%;width:0;border-radius:6px;background:var(--amp);transition:width .4s}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.fact span{display:block;font-size:12px;color:var(--muted)}.fact b{font-size:17px;font-weight:600}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 2px 10px}
.section-title h2{font-size:16px;margin:0}.section-title span{font-size:12px;color:var(--faint)}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.pair>*,.hero>*{min-width:0}
.chart{position:relative;margin-top:10px}
.chart canvas{display:block}
.tip{position:absolute;pointer-events:none;background:rgba(29,41,57,.92);color:#fff;font-size:12px;line-height:1.5;padding:6px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);z-index:3}
.card h3{font-size:14px;margin:0;font-weight:600}
.card h3 small{font-weight:400;color:var(--faint);margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:#f9fafc;border-radius:12px;padding:12px 14px}.stat span{font-size:12px;color:var(--muted)}.stat b{display:block;font-size:22px;font-weight:600;margin-top:2px}
.rows .row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.rows .row:last-child{border:0}
.rows .row span{color:var(--muted)}
.history-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.history-bar .seg button{padding:5px 12px;font-size:13px}
.custom{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=datetime-local]{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff;color:var(--ink)}
.btn{font:inherit;font-size:13px;border:1px solid var(--primary);background:var(--primary);color:#fff;border-radius:8px;padding:5px 14px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.links{margin-left:auto;font-size:13px;display:flex;gap:12px}
a{color:var(--primary);text-decoration:none}a:hover{text-decoration:underline}
.err{color:var(--bad);font-size:13px}
.hint{color:var(--faint);font-size:12px}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
footer{color:var(--faint);font-size:12px;text-align:center;padding:4px 0 0}
@media (max-width:640px){.bar,main{padding-left:14px;padding-right:14px}.big{font-size:32px}.links{margin-left:0}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 4 12 2.5-6H21"/></svg></div>
    <div><h1 data-i18n="h1"></h1><small>R60ABD1 · Quectel Pi M2</small></div>
  </div>
  <div class="tools">
    <div class="seg" role="group" data-i18n-aria="mode_group"><button id="mode-realtime" type="button" aria-pressed="false" data-i18n="mode_realtime"></button><button id="mode-sleep" type="button" aria-pressed="false" data-i18n="mode_sleep"></button></div>
    <div class="chip" id="connection" data-state="busy"><i class="dot"></i><span id="connection-text"></span></div>
    <button class="lang" id="lang-toggle" type="button" aria-label="Language / 语言"></button>
  </div>
</div></header>

<main>
  <div id="notice" class="banner note" role="status" hidden></div>
  <div id="alarm" class="banner alert" role="alert" hidden></div>

  <section>
    <div class="hero">
      <article class="card">
        <div class="label" data-i18n="presence"></div>
        <div class="big dim"><span id="presence-text">--</span></div>
        <div class="sub" id="presence-sub">&nbsp;</div>
      </article>
      <article class="card">
        <div class="label" style="color:var(--resp)" data-i18n="resp"></div>
        <div class="big dim"><span id="resp-val">--</span><small data-i18n="unit_bpm"></small></div>
        <div class="sub"><span class="pill" id="resp-pill">--</span> <span id="resp-sub"></span></div>
      </article>
      <article class="card">
        <div class="label" style="color:var(--heart)" data-i18n="heart"></div>
        <div class="big dim"><span id="heart-val">--</span><small data-i18n="unit_bpm"></small></div>
        <div class="sub" id="heart-sub">&nbsp;</div>
      </article>
      <article class="card">
        <div class="label" style="color:var(--amp)" data-i18n="amp"></div>
        <div class="big dim"><span id="amp-val">--</span><small>/ 100</small></div>
        <div class="meter"><i id="amp-bar"></i></div>
        <div class="sub" id="amp-sub">&nbsp;</div>
      </article>
    </div>
    <div id="flow-hint" class="banner note" style="margin-top:16px" hidden></div>
    <div class="facts" style="margin-top:16px">
      <div class="fact"><span data-i18n="motion"></span><b id="motion-text">--</b></div>
      <div class="fact"><span data-i18n="distance"></span><b id="distance-text">--</b></div>
      <div class="fact"><span data-i18n="range"></span><b id="range-text">--</b></div>
    </div>
  </section>

  <section id="waveforms" hidden>
    <div class="section-title"><h2 data-i18n="waves_title"></h2><span data-i18n="waves_sub"></span></div>
    <div class="pair">
      <article class="card"><h3 style="color:var(--resp)" data-i18n="wave_resp"></h3><div class="chart"><canvas id="resp-wave"></canvas></div></article>
      <article class="card"><h3 style="color:var(--heart)" data-i18n="wave_heart"></h3><div class="chart"><canvas id="heart-wave"></canvas></div></article>
    </div>
  </section>

  <section id="sleep-section" hidden>
    <div class="section-title"><h2 data-i18n="sleep_title"></h2><span data-i18n="sleep_sub"></span></div>
    <div class="grid" id="sleep"></div>
    <div class="pair" style="margin-top:16px">
      <article class="card"><h3 data-i18n="summary_title"></h3><div class="rows" id="summary"></div></article>
      <article class="card"><h3 data-i18n="analysis_title"></h3><div class="hint" id="analysis-note"></div><div class="rows" id="analysis"></div></article>
    </div>
  </section>

  <section>
    <div class="section-title"><h2 data-i18n="history_title"></h2><span id="history-meta"></span></div>
    <article class="card">
      <div class="history-bar">
        <div class="seg" id="history-presets" role="group" data-i18n-aria="range_group">
          <button type="button" data-hours="1" aria-pressed="false" data-i18n="h1h"></button>
          <button type="button" data-hours="6" aria-pressed="false" data-i18n="h6h"></button>
          <button type="button" data-hours="12" aria-pressed="true" data-i18n="h12h"></button>
          <button type="button" data-hours="24" aria-pressed="false" data-i18n="h24h"></button>
          <button type="button" data-hours="0" aria-pressed="false" data-i18n="hcustom"></button>
        </div>
        <form class="custom" id="history-form" hidden>
          <input id="history-start" type="datetime-local" step="1" required>
          <span class="hint" data-i18n="to"></span>
          <input id="history-end" type="datetime-local" step="1" required>
          <button class="btn" type="submit" data-i18n="query"></button>
        </form>
        <span class="links"><a id="history-csv" hidden data-i18n="export_csv"></a><a id="history-jsonl" hidden data-i18n="export_jsonl"></a></span>
      </div>
      <div id="history-error" class="err" hidden></div>
      <div style="margin-top:16px">
        <div class="label"><span data-i18n="hist_presence"></span> <span class="hint" id="presence-legend"></span></div>
        <div class="chart"><canvas id="history-presence"></canvas></div>
      </div>
      <div class="pair" style="margin-top:12px">
        <div><h3 style="color:var(--resp)"><span data-i18n="hist_resp"></span><small data-i18n="unit_bpm"></small></h3><div class="chart"><canvas id="history-resp"></canvas></div></div>
        <div><h3 style="color:var(--heart)"><span data-i18n="hist_heart"></span><small data-i18n="unit_bpm"></small></h3><div class="chart"><canvas id="history-heart"></canvas></div></div>
      </div>
      <div style="margin-top:12px">
        <h3 style="color:var(--amp)"><span data-i18n="hist_amp"></span><small>0-100</small></h3><div class="chart"><canvas id="history-amp"></canvas></div>
      </div>
      <details id="history-alarms-box" style="margin-top:12px" hidden><summary data-i18n="alarm_log"></summary><div class="rows" id="history-alarms"></div></details>
    </article>
  </section>

  <details class="card" id="device">
    <summary data-i18n="device"></summary>
    <div class="rows" id="diagnostics" style="margin-top:8px"></div>
  </details>
  <footer data-i18n="footer"></footer>
</main>

async function switchMode(mode) {
  if (changing) return;
  changing = true; requestVersion++; clearDisplay();
  $("mode-realtime").disabled = $("mode-sleep").disabled = true;
  setConn("busy", "switching");
  try {
    const response = await fetch("/api/mode", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({mode})});
    const result = await response.json();
    if (!response.ok) throw Error(result.error || "error");
    changing = false; render(result);
  } catch (error) {
    changing = false; setNotes([["n_switch_fail", error.message]]);
    setConn("bad", "switch_failed");
    $("mode-realtime").disabled = $("mode-sleep").disabled = false;
  }
}
async function refresh() {
  const version = requestVersion;
  try {
    if (!changing) {
      const r = await fetch("/api/snapshot?after=" + cursor + "&session=" + (session || ""), {cache: "no-store"});
      if (!r.ok) throw Error("HTTP " + r.status);
      const s = await r.json();
      if (version === requestVersion && !changing) render(s);
    }
  } catch (e) {
    if (version === requestVersion && !changing) { setConn("bad", "conn_lost"); setNotes([["n_down"]]); }
  } finally { setTimeout(refresh, 2000); }
}

I18N.zh.connected_fps = n => I18N.zh.connected + " · " + I18N.zh.fps(n);
I18N.en.connected_fps = n => I18N.en.connected + " · " + I18N.en.fps(n);

$("mode-realtime").addEventListener("click", () => switchMode("realtime"));
$("mode-sleep").addEventListener("click", () => switchMode("sleep"));
$("lang-toggle").addEventListener("click", () => setLang(lang === "zh" ? "en" : "zh"));
document.querySelectorAll("#history-presets button").forEach(b => b.addEventListener("click", () => choosePreset(Number(b.dataset.hours))));
$("history-form").addEventListener("submit", event => {
  event.preventDefault();
  queryHistory({start: Date.parse($("history-start").value), end: Date.parse($("history-end").value)});
});
let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { drawWaves(); renderHistory(); }, 150);
});
applyStatic();
showConn();
renderOverview({common: {}});
drawWaves();
renderHistory();
choosePreset(12);
refresh();
</script>
</body>
